<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NovaXpress Logistics - PDA Mobile & Operational Web Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NovaXpress PDA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NovaXpress Logistics | Operational System</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect & Preload Official Paystack Inline SDK -->
  <link rel="preconnect" href="https://js.paystack.co">
  <link rel="dns-prefetch" href="https://js.paystack.co">
  <script src="https://js.paystack.co/v2/inline.js" defer></script>

  <!-- Branded Web Splash Styling -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1021;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0A0E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      border-radius: 28px;
      animation: pulse 2s infinite ease-in-out;
      box-shadow: 0 12px 32px rgba(243, 112, 33, 0.25);
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top: 3.5px solid #F37021;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .brand-title {
      color: #F8FAFC;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0 0 6px 0;
      text-transform: uppercase;
    }

    .system-status {
      color: #94A3B8;
      font-size: 12px;
      letter-spacing: 1px;
      margin: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- HTML Splash Loader overlay while Flutter WASM/CanvasKit initializes -->
  <div id="splash-container">
    <div class="logo-wrapper">
      <img src="icons/Icon-192.png" alt="NovaXpress Logo" class="brand-logo" />
    </div>
    <div class="spinner"></div>
    <h1 class="brand-title">NovaXpress Logistics</h1>
    <p class="system-status">Initializing Operational System...</p>
  </div>

  <!-- Paystack Inline SDK (Modern V2 with automatic fallback watchdog) -->
  <script>
    window.payWithPaystack = function(options, onSuccess, onClose) {
      var watchdogTimer = null;

      function cleanupPaystackBackdrop() {
        if (watchdogTimer) clearTimeout(watchdogTimer);
        // Remove any trapped or stuck paystack overlays if iframe failed to mount
        try {
          var stuckOverlays = document.querySelectorAll('div[id*="paystack"], .paystack-iframe-wrapper, iframe[name*="paystack"]');
          stuckOverlays.forEach(function(el) {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          });
        } catch (_) {}
      }

      function executePaystack() {
        try {
          if (typeof PaystackPop === 'undefined') {
            console.warn('[PAYSTACK] PaystackPop not found, triggering in-app fallback');
            if (window.__paystack_on_fallback) window.__paystack_on_fallback();
            else if (onClose) onClose();
            return;
          }

          var meta = options.metadata || {};
          if (typeof meta === 'string') {
            try { meta = JSON.parse(meta); } catch(e) { meta = {}; }
          }

          var hasHandled = false;

          // 1. Try Modern Paystack Inline V2 API
          try {
            var paystack = new PaystackPop();
            if (paystack && typeof paystack.newTransaction === 'function') {
              console.log('[PAYSTACK] Initializing via Paystack Inline V2 newTransaction');
              paystack.newTransaction({
                key: options.key,
                email: options.email,
                amount: options.amount,
                currency: options.currency || 'NGN',
                ref: options.ref,
                metadata: meta,
                onSuccess: function(transaction) {
                  if (hasHandled) return;
                  hasHandled = true;
                  cleanupPaystackBackdrop();
                  console.log('[PAYSTACK] V2 Payment successful:', transaction);
                  var resolvedRef = (transaction && transaction.reference) ? transaction.reference : options.ref;
                  if (onSuccess) onSuccess(resolvedRef);
                },
                onCancel: function() {
                  if (hasHandled) return;
                  hasHandled = true;
                  cleanupPaystackBackdrop();
                  console.log('[PAYSTACK] V2 Checkout closed by user');
                  if (onClose) onClose();
                },
                onError: function(err) {
                  console.warn('[PAYSTACK] V2 Checkout error:', err);
                  if (hasHandled) return;
                  hasHandled = true;
                  cleanupPaystackBackdrop();
                  if (window.__paystack_on_fallback) window.__paystack_on_fallback();
                  else if (onClose) onClose();
                }
              });

              // Watchdog: If user gets trapped on infinite black screen/spinner for > 15 seconds without mounting
              watchdogTimer = setTimeout(function() {
                var mountedElement = document.querySelector('iframe[src*="paystack"], iframe[name*="paystack"], iframe[id*="paystack"], div[id*="paystack"], .paystack-iframe-wrapper');
                if (!mountedElement && !hasHandled) {
                  console.warn('[PAYSTACK] Watchdog: Paystack iframe blocked or not mounted. Activating in-app overlay.');
                  hasHandled = true;
                  cleanupPaystackBackdrop();
                  if (window.__paystack_on_fallback) window.__paystack_on_fallback();
                }
              }, 15000);

              return;
            }
          } catch (v2Err) {
            console.warn('[PAYSTACK] V2 newTransaction not available, attempting V1 setup fallback:', v2Err);
          }

          // 2. Fallback to Paystack Inline V1 API
          if (typeof PaystackPop.setup === 'function') {
            console.log('[PAYSTACK] Initializing via Paystack Inline V1 setup');
            var handler = PaystackPop.setup({
              key: options.key,
              email: options.email,
              amount: options.amount,
              currency: options.currency || 'NGN',
              ref: options.ref,
              metadata: meta,
              callback: function(response) {
                if (hasHandled) return;
                hasHandled = true;
                cleanupPaystackBackdrop();
                console.log('[PAYSTACK] V1 Payment successful callback:', response);
                var resolvedRef = (response && response.reference) ? response.reference : options.ref;
                if (onSuccess) onSuccess(resolvedRef);
              },
              onClose: function() {
                if (hasHandled) return;
                hasHandled = true;
                cleanupPaystackBackdrop();
                console.log('[PAYSTACK] V1 Popup dismissed by user');
                if (onClose) onClose();
              }
            });
            handler.openIframe();
            return;
          }

          // Neither V2 nor V1 succeeded
          if (window.__paystack_on_fallback) window.__paystack_on_fallback();
          else if (onClose) onClose();
        } catch (err) {
          console.error('[PAYSTACK] Paystack launch exception:', err);
          cleanupPaystackBackdrop();
          if (window.__paystack_on_fallback) window.__paystack_on_fallback();
          else if (onClose) onClose();
        }
      }

      if (typeof PaystackPop === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://js.paystack.co/v2/inline.js';
        s.async = true;
        s.onload = executePaystack;
        s.onerror = function() {
          console.error('[PAYSTACK] Failed to fetch v2/inline.js from CDN, falling back to in-app overlay');
          if (window.__paystack_on_fallback) window.__paystack_on_fallback();
          else if (onClose) onClose();
        };
        document.head.appendChild(s);
      } else {
        executePaystack();
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    function removeSplashScreen() {
      var splash = document.getElementById('splash-container');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    window.addEventListener('flutter-first-frame', removeSplashScreen);

    // Continuous check in case first-frame event fired before listener or was missed
    var checkFlutterLoadedInterval = setInterval(function () {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        clearInterval(checkFlutterLoadedInterval);
        removeSplashScreen();
      }
    }, 150);

    // Guaranteed safety fallback: never trap user on splash screen
    setTimeout(function () {
      clearInterval(checkFlutterLoadedInterval);
      removeSplashScreen();
    }, 5000);
  </script>
</body>
</html>
