<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NovaExpress Logistics - PDA Mobile & Operational Web Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NovaExpress PDA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NovaExpress Logistics | Operational System</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded Web Splash Styling -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1021;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      border-radius: 28px;
      animation: pulse 2s infinite ease-in-out;
      box-shadow: 0 12px 32px rgba(243, 112, 33, 0.25);
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top: 3.5px solid #F37021;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .brand-title {
      color: #F8FAFC;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0 0 6px 0;
      text-transform: uppercase;
    }

    .system-status {
      color: #94A3B8;
      font-size: 12px;
      letter-spacing: 1px;
      margin: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- HTML Splash Loader overlay while Flutter WASM/CanvasKit initializes -->
  <div id="splash-container">
    <div class="logo-wrapper">
      <img src="icons/Icon-192.png" alt="NovaExpress Logo" class="brand-logo" />
    </div>
    <div class="spinner"></div>
    <h1 class="brand-title">NovaExpress Logistics</h1>
    <p class="system-status">Initializing Operational System...</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
