<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

2M3_CwCm_xkwhRT8Vh6u4BRx9Dxi5yxrltXj1XKe_C-Ad973VWxEc4jzDWzBHzIqeEEJ9OvfQgvZ_atBMVGDP7cA"/><span class="font-headline-sm text-headline-sm text-primary uppercase tracking-tight">Home</span></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="pt-16 pb-24 min-h-screen bg-surface"><div class="flex flex-col w-full h-full bg-surface pb-safe">
<!-- Shipment Info Card -->
<div class="px-margin-mobile pt-margin-mobile pb-stack-md">
<div class="bg-surface-container-lowest shadow-sm p-stack-md flex flex-col gap-stack-sm rounded-lg border border-outline-variant">
<div class="flex justify-between items-center">
<span class="font-label-bold text-on-surface-variant uppercase tracking-wider text-[12px]">Shipment ID</span>
<span class="font-label-bold text-primary bg-primary-fixed px-2 py-1 rounded">TRK-8924-NIG</span>
</div>
<div class="h-[1px] w-full bg-outline-variant/30 my-1"></div>
<div class="flex items-start gap-stack-md mt-1">
<div class="w-12 h-12 bg-surface-container-highest rounded flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">package_2</span>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-on-surface line-clamp-1">3x Industrial Valves</span>
<span class="font-body-md text-on-surface-variant mt-1">Lekki Phase 1, Lagos</span>
</div>
</div>
</div>
</div>
<!-- Collection Amount Header -->
<div class="px-margin-mobile py-stack-md flex flex-col items-center justify-center bg-surface-container-low border-y border-outline-variant/30">
<span class="font-label-bold text-on-surface-variant uppercase mb-unit">Total to Collect</span>
<span class="font-currency-xl text-primary tracking-tight">₦ 27,500</span>
</div>
<!-- Form Section -->
<div class="px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
<!-- Amount Collected Input -->
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-bold text-on-surface uppercase text-[12px]" for="amount-collected">Amount Collected</label>
<div class="relative flex items-center w-full">
<span class="absolute left-4 font-currency-xl text-on-surface-variant z-10 pointer-events-none">₦</span>
<input class="w-full h-16 pl-12 pr-4 bg-surface-container-lowest font-currency-xl text-on-surface border-2 border-outline focus:border-primary focus:ring-0 outline-none rounded-lg transition-colors placeholder:text-outline-variant" id="amount-collected" inputmode="numeric" placeholder="27,500" type="number" value="27500"/>
</div>
</div>
<!-- Payment Method Dropdown -->
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-bold text-on-surface uppercase text-[12px]" for="payment-method">Payment Method</label>
<div class="relative flex items-center w-full">
<select class="w-full h-14 pl-4 pr-12 bg-surface-container-lowest font-body-lg text-on-surface border-2 border-outline focus:border-primary focus:ring-0 outline-none rounded-lg appearance-none cursor-pointer" id="payment-method">
<option selected="" value="cash">Cash</option>
<option value="transfer">Bank Transfer</option>
<option value="pos">POS Terminal</option>
</select>
<div class="absolute right-4 pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Bank Transfer Details (Hidden by default, shown via JS) -->
<div class="hidden bg-surface-container p-stack-md rounded-lg border border-outline-variant flex-col gap-stack-sm" id="transfer-details">
<span class="font-label-bold text-on-surface-variant uppercase text-[10px]">Reference Number</span>
<input class="w-full h-12 px-4 bg-surface-container-lowest font-body-md text-on-surface border-2 border-outline-variant focus:border-primary outline-none rounded" placeholder="Enter bank ref (e.g., 092...)" type="text"/>
</div>
<!-- Confirmation Checkbox -->
<div class="mt-stack-sm">
<label class="flex items-start gap-stack-md cursor-pointer group p-2 -ml-2 rounded-lg hover:bg-surface-container-highest transition-colors">
<div class="relative flex items-center justify-center shrink-0 mt-1">
<input class="peer sr-only" id="customer-confirm" type="checkbox"/>
<div class="w-8 h-8 bg-surface-container-lowest border-2 border-outline rounded flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-all">
<span class="material-symbols-outlined text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity text-[20px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-on-surface group-hover:text-primary transition-colors">Customer Confirmed Receipt</span>
<span class="font-body-md text-on-surface-variant mt-1">Verify condition of goods before checking.</span>
</div>
</label>
</div>
</div>
<!-- Bottom Action Bar (Fixed at bottom above nav) -->
<div class="mt-auto px-margin-mobile pb-stack-lg pt-stack-md bg-surface-container-lowest border-t border-outline-variant/30 sticky bottom-0 shadow-[0_-4px_16px_rgba(0,0,0,0.05)] z-40">
<button class="w-full h-16 bg-outline-variant text-surface flex items-center justify-center gap-stack-sm rounded-lg font-headline-sm uppercase tracking-wide transition-all disabled:opacity-50" disabled="" id="complete-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">task_alt</span>
      Confirm & Complete
    </button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const paymentMethodSelect = document.getElementById('payment-method');
    const transferDetails = document.getElementById('transfer-details');
    const confirmCheckbox = document.getElementById('customer-confirm');
    const completeBtn = document.getElementById('complete-btn');
    const amountInput = document.getElementById('amount-collected');

    // Toggle transfer details
    paymentMethodSelect.addEventListener('change', (e) => {
      if (e.target.value === 'transfer') {
        transferDetails.classList.remove('hidden');
        transferDetails.classList.add('flex');
      } else {
        transferDetails.classList.add('hidden');
        transferDetails.classList.remove('flex');
      }
      validateForm();
    });

    // Validate form to enable button
    const validateForm = () => {
      const isConfirmed = confirmCheckbox.checked;
      const hasAmount = amountInput.value.trim().length > 0;
      
      if (isConfirmed && hasAmount) {
        completeBtn.disabled = false;
        completeBtn.classList.remove('bg-outline-variant', 'text-surface');
        completeBtn.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-md', 'active:scale-[0.98]');
      } else {
        completeBtn.disabled = true;
        completeBtn.classList.add('bg-outline-variant', 'text-surface');
        completeBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-md', 'active:scale-[0.98]');
      }
    };

    confirmCheckbox.addEventListener('change', validateForm);
    amountInput.addEventListener('input', validateForm);

    // Ripple effect on button click
    completeBtn.addEventListener('click', function(e) {
      if(this.disabled) return;
      
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const ripple = document.createElement('div');
      ripple.className = 'absolute bg-white/30 rounded-full pointer-events-none transform -translate-x-1/2 -translate-y-1/2 animate-[ripple_0.6s_ease-out]';
      ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) * 2 + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      
      this.style.position = 'relative';
      this.style.overflow = 'hidden';
      this.appendChild(ripple);
      
      setTimeout(() => ripple.remove(), 600);

      // Simulate completion
      this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Processing...';
      
      setTimeout(() => {
        this.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Delivered';
        this.classList.replace('bg-secondary-container', 'bg-[#006837]');
        this.classList.replace('text-on-secondary-container', 'text-white');
      }, 1500);
    });
  });
</script>
<style>
  @keyframes ripple {
    from { transform: scale(0); opacity: 1; }
    to { transform: scale(4); opacity: 0; }
  }
</style></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-secondary"><div class="h-16 flex items-center justify-around px-unit"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[48px] text-secondary" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="font-label-bold text-[10px] uppercase mt-1">Home</span></a><a class="flex flex-col items-center justify-center min-w-[48px] text-on-surface-variant hover:text-secondary" data-path="orders" href="#"><span class="material-symbols-outlined">local_shipping</span><span class="font-label-bold text-[10px] uppercase mt-1">Orders</span></a><a class="flex flex-col items-center justify-center min-w-[48px] text-on-surface-variant hover:text-secondary" data-path="stock" href="#"><span class="material-symbols-outlined">inventory_2</span><span class="font-label-bold text-[10px] uppercase mt-1">Stock</span></a><a class="flex flex-col items-center justify-center min-w-[48px] text-on-surface-variant hover:text-secondary" data-path="finance" href="#"><span class="material-symbols-outlined">payments</span><span class="font-label-bold text-[10px] uppercase mt-1">Finance</span></a></div></nav></body></html>
