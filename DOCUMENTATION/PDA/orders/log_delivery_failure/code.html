<script>
    document.addEventListener('DOMContentLoaded', () => {
        const radios = document.querySelectorAll('input[name="failure_reason"]');
        const submitBtn = document.getElementById('submit-btn');
        const textarea = document.getElementById('failure_notes');
        const quickTags = document.querySelectorAll('.quick-tag');

        // Enable submit button when a reason is selected
        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                submitBtn.disabled = false;
                
                // Add a subtle shake to textarea if 'other' is selected to prompt input
                if(radio.value === 'other' && textarea.value.trim() === '') {
                    textarea.classList.add('animate-pulse');
                    setTimeout(() => textarea.classList.remove('animate-pulse'), 1000);
                    textarea.focus();
                }
            });
        });

        // Quick tag injection
        quickTags.forEach(tag => {
            tag.addEventListener('click', () => {
                const currentVal = textarea.value;
                const tagText = tag.innerText;
                if (currentVal.length > 0 && !currentVal.endsWith(' ')) {
                    textarea.value = currentVal + '. ' + tagText;
                } else {
                    textarea.value = currentVal + tagText;
                }
                textarea.focus();
                
                // Visual feedback on tag
                tag.classList.add('bg-primary', 'text-on-primary');
                tag.classList.remove('bg-surface-container', 'text-on-surface-variant');
                setTimeout(() => {
                    tag.classList.remove('bg-primary', 'text-on-primary');
                    tag.classList.add('bg-surface-container', 'text-on-surface-variant');
                }, 300);
            });
        });

        // Submit animation simulation
        submitBtn.addEventListener('click', (e) => {
            if (submitBtn.disabled) return;
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span> Processing...';
            submitBtn.classList.add('opacity-90');
            
            setTimeout(() => {
                submitBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Report Logged';
                submitBtn.classList.replace('bg-error', 'bg-tertiary-container');
                submitBtn.classList.replace('text-on-error', 'text-on-tertiary-container');
                
                // Create ripple effect outward from button
                const ripple = document.createElement('div');
                ripple.className = 'fixed inset-0 bg-tertiary-container/20 z-50 pointer-events-none transition-opacity duration-500 opacity-100';
                document.body.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.classList.replace('opacity-100', 'opacity-0');
                    setTimeout(() => ripple.remove(), 500);
                }, 100);

            }, 1200);
        });
    });
