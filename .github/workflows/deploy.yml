name: Build WASM & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WASM & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Flutter Web (WebAssembly / WASM)
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Building WebAssembly (WASM) for repository: $REPO_NAME"
          flutter build web --wasm --release --base-href "/${REPO_NAME}/"

      - name: Configure SPA Routing Fallback (404.html)
        run: |
          # Copy index.html to 404.html so GoRouter deep links and page refreshes work smoothly on GitHub Pages
          cp build/web/index.html build/web/404.html

      - name: Add COOP & COEP Headers for WebAssembly Support
        run: |
          # Write headers config for static hosts
          cat << 'EOF' > build/web/_headers
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
