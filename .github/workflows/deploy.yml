name: Build WASM & Test & Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WASM & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Verification Test Suite
        run: |
          flutter test \
            test/novaxpress_two_admin_dashboards_test.dart \
            test/novaxpress_master_stock_keeper_console_test.dart \
            test/novaxpress_logistics_workflow_test.dart \
            test/novaxpress_stock_keeper_separation_test.dart \
            test/damilare_master_stock_and_daily_sales_test.dart \
            test/widget_test.dart

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Flutter Web WASM Release
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "/" ]; then
            CLEAN_PATH=$(echo "$BASE_PATH" | sed 's|^/||;s|/$||')
            BASE_HREF="/${CLEAN_PATH}/"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            if [ -n "$REPO_NAME" ] && [ ! -f "CNAME" ] && [ ! -f "web/CNAME" ]; then
              BASE_HREF="/${REPO_NAME}/"
            else
              BASE_HREF="/"
            fi
          fi
          echo "Building Flutter Web WASM Release with base-href: $BASE_HREF"
          flutter build web --release --wasm --base-href "$BASE_HREF"

      - name: Configure SPA Routing Fallback (404.html) & Jekyll Override
        run: |
          # Copy index.html to 404.html so GoRouter deep links and page refreshes work smoothly on GitHub Pages
          cp build/web/index.html build/web/404.html
          # Disable Jekyll so special folders, wasm assets, and headers are preserved
          touch build/web/.nojekyll
          if [ -f "web/CNAME" ]; then
            cp web/CNAME build/web/CNAME
          fi

      - name: Add Static Hosting Headers
        run: |
          # Safe hosting headers without COEP require-corp which blocks third-party payment iframes (Paystack)
          cat << 'EOF' > build/web/_headers
          /*
            X-Frame-Options: SAMEORIGIN
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
          EOF

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: deployment
        uses: actions/deploy-pages@v4
