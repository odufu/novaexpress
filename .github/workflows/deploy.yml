name: Build WASM & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WASM & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Flutter Web (WebAssembly / WASM)
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -f "CNAME" ] || [ -f "web/CNAME" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/${REPO_NAME}/"
          fi
          echo "Building WebAssembly (WASM) for repository: $REPO_NAME with base-href: $BASE_HREF"
          flutter build web --wasm --release --base-href "$BASE_HREF"

      - name: Configure SPA Routing Fallback (404.html) & Jekyll Override
        run: |
          # Copy index.html to 404.html so GoRouter deep links and page refreshes work smoothly on GitHub Pages
          cp build/web/index.html build/web/404.html
          # Disable Jekyll so special folders and headers are preserved
          touch build/web/.nojekyll
          if [ -f "web/CNAME" ]; then
            cp web/CNAME build/web/CNAME
          fi

      - name: Add Static Hosting Headers
        run: |
          # Write headers config for static hosts (Cloudflare / Netlify / Vercel bridges)
          cat << 'EOF' > build/web/_headers
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
